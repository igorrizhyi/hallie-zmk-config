name: QMK (TBK Mini)

# The Hallie layout, built for the wired TBK Mini as a fallback board.
# Runs only when the QMK sources change; the ZMK build is untouched.
#
# Deliberately not using the qmk_cli container: it ships a current CLI
# whose Python dependencies no longer match QMK 0.22.x, which is the
# version this keymap targets. Installing the toolchain ourselves keeps
# every version pinned and the failure modes obvious.
on:
  push:
    paths:
      - 'qmk/**'
      - '.github/workflows/qmk.yml'
  workflow_dispatch:

env:
  # BastardKB maintain their own QMK fork, and their board definitions
  # differ from upstream's. Firmware built from upstream qmk/qmk_firmware
  # compiles and flashes but does not run on this hardware. This is the
  # exact commit Igor's working local tree is based on.
  QMK_REPO: 'https://github.com/Bastardkb/bastardkb-qmk.git'
  QMK_SHA: 'ac18912dea49920ecab3f9f339ea7b78c1965e1e'
  QMK_KB: 'bastardkb/tbkmini/v2/splinky_3'   # not TARGET: QMK's Makefile uses that name

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this config
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Igor's working firmware was linked against gcc-arm-none-eabi
      # 14.2.0 (per the .map left in his local .build), so use Ubuntu's
      # toolchain to match the environment that is known to produce
      # firmware this board actually runs.
      - name: ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Confirm toolchain version
        run: arm-none-eabi-gcc --version | head -1

      - name: Fetch BastardKB QMK
        run: |
          git init qmk_firmware
          cd qmk_firmware
          git remote add origin "$QMK_REPO"
          git fetch --depth 1 origin "$QMK_SHA"
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1 \
            lib/chibios lib/chibios-contrib lib/pico-sdk lib/printf
          git log -1 --format='built from %H'

      - name: QMK CLI and python requirements
        run: |
          # 0.22.x ships no bundled CLI, so take a contemporary one from
          # PyPI together with the tree's own pinned dependencies.
          python -m pip install 'qmk==1.1.6'
          python -m pip install -r qmk_firmware/requirements.txt

      - name: Install the keymaps
        run: |
          for km in qmk/keymaps/*/; do
            name=$(basename "$km")
            mkdir -p "qmk_firmware/keyboards/bastardkb/tbkmini/keymaps/$name"
            cp "$km"* "qmk_firmware/keyboards/bastardkb/tbkmini/keymaps/$name/"
          done
          ls qmk_firmware/keyboards/bastardkb/tbkmini/keymaps/

      # legacy is Igor's own known-good keymap, built here as a control:
      # if CI cannot produce working firmware from source that works
      # locally, the fault is the build, not the keymap.
      - name: Compile every keymap
        env:
          QMK_HOME: ${{ github.workspace }}/qmk_firmware
        run: |
          for km in qmk/keymaps/*/; do
            name=$(basename "$km")
            echo "::group::$name"
            qmk compile -kb "$QMK_KB" -km "$name"
            echo "::endgroup::"
          done
          ls -l qmk_firmware/*.uf2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tbkmini-hallie-firmware
          path: |
            qmk_firmware/*.uf2
            qmk_firmware/*.hex
          if-no-files-found: error
