# Boost BLE transmit power to +8 dBm (default 0 dBm) so the split link
# survives body attenuation, e.g. halves placed on either side of the legs.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Mouse emulation (movement/scroll behaviors on the mouse layer).
CONFIG_ZMK_POINTING=y

# Matrix scan settling time, in microseconds. The board ships with both at
# 0, so a row input line is read the instant its column is driven. If the
# line has not settled, keys across that whole row read as pressed —
# phantom presses on the right home row (D H T N S and right Shift, all
# one matrix row). These give the lines time to settle.
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=200
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=200

# Scan the matrix on a fixed schedule instead of reacting to GPIO
# interrupts. In interrupt mode a noisy or intermittently floating row
# line raises interrupts by itself, waking the scanner at arbitrary
# moments to read whatever is on the matrix — phantom presses across
# that row. Polling ignores the interrupts, so noise must survive
# debounce to register. Costs battery life: the MCU wakes on a timer
# instead of sleeping until a real keypress.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
